version: "3.9"
# ─────────────────────────────────────────────────────────────
#  Green API Workshop — Docker Compose
#  Devoxx France 2026 — Tools in Action
# ─────────────────────────────────────────────────────────────
services:

  # ── Baseline API (naïve, port 8080) ──────────────────────
  baseline:
    build:
      context: ./green-api-baseline
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    environment:
      - SERVER_PORT=8080
      - JAVA_TOOL_OPTIONS=-XX:+UseContainerSupport -XX:MaxRAMPercentage=75.0 -XX:+ExitOnOutOfMemoryError
    mem_limit: 2g
    memswap_limit: 2g
    restart: on-failure:3
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 40s
    networks:
      - green-net

  # ── Optimized API (port 8081) ────────────────────────────
  optimized:
    build:
      context: ./green-api-optimized
      dockerfile: Dockerfile
    ports:
      - "8081:8081"
    depends_on:
      baseline:
        condition: service_healthy
    environment:
      - SERVER_PORT=8081
      - JAVA_TOOL_OPTIONS=-XX:+UseContainerSupport -XX:MaxRAMPercentage=75.0 -XX:+ExitOnOutOfMemoryError
    mem_limit: 2g
    memswap_limit: 2g
    restart: on-failure:3
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8081/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 40s
    networks:
      - green-net

  # ── Dashboard (nginx, port 3000) ─────────────────────────
  dashboard:
    image: nginx:alpine
    ports:
      - "3000:80"
    volumes:
      - ./dashboard:/dashboard
      - ./dashboard:/usr/share/nginx/html
      - ./reports:/usr/share/nginx/html/reports
    depends_on:
      - baseline
      - optimized
    networks:
      - green-net

  # ── Analyzer (one-shot, generates report) ────────────────

  # ── Analyzer WITH DISCOVERY (one-shot, swagger-driven) ──
  analyzer-discovery:
    image: bash:devel-alpine3.23 #curlimages/curl:latest
    depends_on:
      baseline:
        condition: service_healthy
      optimized:
        condition: service_healthy
    volumes:
      - ./dashboard:/dashboard
      - ./scripts:/scripts
      - ./reports:/reports
      - ./.spectral.yml:/.spectral.yml
    entrypoint: ["sh", "-c"]
    command:
      - |
        apk add --no-cache bash python3 coreutils > /dev/null 2>&1
        BASELINE_PORT=8080 OPTIMIZED_PORT=8081 bash /scripts/green-score-analyzer_withdiscovery_docker.sh
    environment:
      - BASELINE_PORT=8080
      - OPTIMIZED_PORT=8081
    networks:
      - green-net
    profiles:
      - discovery

  # ── Auto-Discover Analyzer (one-shot, swagger-driven) ───
  auto-discover:
    image: python:3.12-slim
    depends_on:
      baseline:
        condition: service_healthy
      optimized:
        condition: service_healthy
    volumes:
      - .:/workspace
    working_dir: /workspace
    entrypoint: ["python3"]
    command:
      - scripts/green-api-auto-discover.py
      - --target
      - http://optimized:8081
      - --repeat
      - "3"
    environment:
      - PYTHONDONTWRITEBYTECODE=1
    networks:
      - green-net
    profiles:
      - auto-discover

networks:
  green-net:
    driver: bridge

